<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Outer vinyl record -->
  <circle cx="24" cy="24" r="22" fill="#1a1a1a"/>

  <!-- Vinyl grooves -->
  <circle cx="24" cy="24" r="20" fill="none" stroke="#333" stroke-width="0.5" opacity="0.6"/>
  <circle cx="24" cy="24" r="18" fill="none" stroke="#333" stroke-width="0.5" opacity="0.6"/>
  <circle cx="24" cy="24" r="16" fill="none" stroke="#333" stroke-width="0.5" opacity="0.6"/>
  <circle cx="24" cy="24" r="14" fill="none" stroke="#333" stroke-width="0.5" opacity="0.6"/>

  <!-- Contrast ring between vinyl and center label -->
  <circle cx="24" cy="24" r="11" fill="none" stroke="#e8e6ff" stroke-width="1.5"/>

  <!-- Center label - using the color scheme -->
  <circle cx="24" cy="24" r="10" fill="#863bff"/>

  <!-- Center label accent -->
  <circle cx="24" cy="24" r="8" fill="#7e14ff"/>

  <!-- Center hole -->
  <circle cx="24" cy="24" r="2" fill="#47bfff"/>

  <!-- Highlight on vinyl for depth -->
  <ellipse cx="20" cy="18" rx="8" ry="6" fill="#47bfff" opacity="0.15"/>
</svg>