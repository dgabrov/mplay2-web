<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="style/style.css">
</head>
<body>
<div class="header">
    <div class="nav">
        <a href="#" class="nav-item active">Login</a>
        <a href="#" class="nav-item">Items</a>
        <a href="#" class="nav-item">Logout</a>
    </div>
    <div class="user-info">
        Daniel G (daniel)
    </div>
</div>

<div class="content">
    <h1>Play</h1>
    <h2>Media: here the title</h2>

    <div class="player-container">
        <div class="player-main">
            <div class="video-placeholder">video tag here</div>

            <div class="controls-section">
                <div class="controls">
                    <button class="control-btn">Previous</button>
                    <button class="control-btn secondary">&lt; 10sec</button>
                    <button class="control-btn primary">Start/Stop</button>
                    <button class="control-btn secondary">&gt; 10sec</button>
                    <button class="control-btn">Next</button>
                </div>
            </div>
        </div>

        <div class="player-sidebar">
            <h3>Playlist</h3>
            <ul class="playlist">
                <li class="playlist-item"><a href="#">play</a> item number 1</li>
                <li class="playlist-item"><a href="#">play</a> item number 2</li>
                <li class="playlist-item current"><a href="#">play</a> item number 3</li>
                <li class="playlist-item"><a href="#">play</a> item number 4</li>
            </ul>
        </div>
    </div>

    <div class="footer-controls">
        <button class="regular-btn">Back</button>
    </div>

</div>
</body>
</html>
