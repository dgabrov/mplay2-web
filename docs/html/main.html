<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="style/style.css">
</head>
<body>
<div class="header">
    <div class="nav">
        <a href="#" class="nav-item active">Login</a>
        <a href="#" class="nav-item">Items</a>
        <a href="#" class="nav-item">Logout</a>
    </div>
    <div class="user-info">
        Daniel G (daniel)
    </div>
</div>

<div class="content">
    <h1>Media</h1>
    <h2>Select media or playlist</h2>

    <div class="fl">
        <h1>Media</h1>
        <div>
            Search:
            <input type="text" class="form-input">
            <button class="regular-btn margin-left">Search</button>
            <button class="regular-btn margin-left">Clear</button>
            <button class="regular-btn">Trim</button>
        </div>
        <table class="table margin-top">
            <thead>
            <tr>
                <td><input type="checkbox"></td>
                <td>Name</td>
                <td>Play</td>
                <td>Edit</td>
            </tr>
            </thead>
            <tbody>
            <tr>
                <td><input type="checkbox"></td>
                <td>media 1 here</td>
                <td><a href="">Play</a></td>
                <td><a href="#">Edit</a></td>
            </tr>
            <tr>
                <td><input type="checkbox"></td>
                <td>media 2 another here</td>
                <td><a href="">Play</a></td>
                <td><a href="#">Edit</a></td>
            </tr>
            </tbody>
        </table>
        <button class="regular-btn margin-top">Add</button>
        <button class="regular-btn margin-top">Remove</button>
    </div>

    <div class="fl margin-top">
        <h1>Playlist</h1>
        <div>
            Search:
            <input type="text" class="form-input">
            <button class="regular-btn margin-left">Search</button>
            <button class="regular-btn margin-left">Clear</button>
            <button class="regular-btn">Trim</button>
        </div>
        <table class="table margin-top">
            <thead>
            <tr>
                <td><input type="checkbox"></td>
                <td>Name</td>
                <td>Play</td>
                <td>Edit</td>
            </tr>
            </thead>
            <tbody>
            <tr>
                <td><input type="checkbox"></td>
                <td>media 1 here</td>
                <td><a href="">Play</a></td>
                <td><a href="#">Edit</a></td>
            </tr>
            <tr>
                <td><input type="checkbox"></td>
                <td>media 2 another here</td>
                <td><a href="">Play</a></td>
                <td><a href="#">Edit</a></td>
            </tr>
            </tbody>
        </table>
        <button class="regular-btn margin-top">Add</button>
        <button class="regular-btn margin-top">Remove</button>
    </div>
</div>
</body>
</html>
